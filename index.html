<script>

const ST=[['P','حاضر','ح','#0b8f7e'],['A','غائب','غ','#d9534f'],['E','متأخر بعذر','ت ب','#d99a00'],['L','متأخر بدون عذر','ت ع','#e8590c']];
const DAYS=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];

function init(){const w=uid();return{groupsOn:false,groups:['المجموعة الأولى'].map(n=>({id:uid(),name:n,on:true,students:[]})),days:DAYS.map((n,i)=>({n,on:i>0&&i<6})),weeks:[{id:w,name:'الأسبوع 1'}],cur:w,att:{},labels:{},feat:{},locks:{},settings:{dateMode:'none'}}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.groups)S=init();
S.labels=S.labels||{};S.feat=S.feat||{};S.locks=S.locks||{};S.att=S.att||{};S.settings=S.settings||{dateMode:'none'};S.dates=S.dates||{};S.groupsOn=!!S.groupsOn;if(!S.groups.length)S.groups.push({id:uid(),name:'المجموعة الأولى',on:true,students:[]});
const SEED=[['د. عوض المنكاع','جمعية مسارات المهنة'],['عبدالمجيد الرشيد','جمعية أريب الشبابية'],['ريان الشايع','جمعية أريب الشبابية'],['عمر الجعيد','جمعية بصمات المستقبل الشبابية'],['سليمان الزيد','دوحة الأفكار / وهج'],['راكان الشرهان','جمعية ثروة الشبابية'],['عبدالكريم الرويلي','جمعية جدير الشبابية'],['محمد الدخيل','جمعية قيم الشبابية'],['جابر العرياني','جمعية آفاق الخير الشبابية'],['معتز الراشد','جمعية مكنون / طاقات / الرياحين'],['عبدالله الأسمري','جمعية الرياحين'],['تميم الحبس','جيل العطاء الوقفية'],['محمد اليحيى','جمعية الرياحين'],['يوسف باسليمان','جمعية أفياء الشبابية'],['أسامة العمري','مركز دلائل التعظيم']];
if(!S.seed1){const all=S.groups.flatMap(g=>g.students);SEED.forEach(x=>{const e=all.find(a=>a.name===x[0]);if(e){if(!e.org)e.org=x[1]}else S.groups[0].students.push({id:uid(),name:x[0],org:x[1]})});S.seed1=1;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}try{window.cloudSync&&window.cloudSync()}catch(e){}};
window.__S=()=>S;
const T=k=>{const v=S.labels[k];return v?v:LD[k]};
const F=k=>S.feat[k]!==false;
const DT=(w,i)=>S.dates[w+'|'+i]||'';
const OT=s=>F('wplace')?`<td>${esc(s.org||'')}</td>`:'',OH=r=>F('wplace')?`<th${r>1?` rowspan="${r}"`:''}>جهة العمل</th>`:'';
let mode='v',sub='a',tab=null,vtab=null,vw=null,vq='',day=0,rq='',sc='cur',unlocked={};
const G=id=>S.groups.find(g=>g.id===id);
const grpList=()=>S.groupsOn?S.groups.filter(g=>g.on).map(g=>({id:g.id,name:g.name,students:g.students})):[{id:'*',name:'جميع المشاركين',students:S.groups.flatMap(g=>g.students)}];
const GS=id=>id==='*'?S.groups.flatMap(g=>g.students):G(id).students;
const curW=()=>S.weeks.find(w=>w.id===S.cur)||S.weeks[0];
/* theme / fs */
function setTheme(t){document.documentElement.dataset.theme=t;document.documentElement.style.colorScheme=t;$('tg').textContent=t==='dark'?'☀️':'🌙'}

function toggleFs(){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen&&document.exitFullscreen()}
function ask(msg,cb,o){o=o||{};const d=document.createElement('div');d.className='ovl';d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px';
 d.innerHTML='<div class="card" style="max-width:340px;text-align:center;margin:0"><p style="font-weight:700">'+esc(msg)+'</p>'+(o.input?'<input id="aiv" type="password" style="width:100%;text-align:center;margin-bottom:10px">':'')+'<div class="row" style="justify-content:center"><button class="btn'+(o.red?' x':'')+'" id="ay">'+(o.yes||'موافق')+'</button><button class="btn g" id="an">إلغاء</button></div></div>';
 document.body.appendChild(d);const i=d.querySelector('#aiv');if(i){i.focus();i.onkeydown=e=>{if(e.key==='Enter')d.querySelector('#ay').click()}}
 d.querySelector('#an').onclick=()=>d.remove();d.querySelector('#ay').onclick=()=>{const v=i?i.value:'';d.remove();cb(v)}}

/* locks */
const LKI=k=>S.locks[k]&&S.locks[k].on?' 🔒':'';
const locked=k=>S.locks[k]&&S.locks[k].on&&!unlocked[k];
function gate(k,cb){if(!locked(k))return cb();ask('أدخل رمز القفل للمتابعة',v=>{if(v===S.locks[k].code){unlocked[k]=1;cb()}else toast('الرمز غير صحيح')},{input:1})}
const lockOf=()=>mode==='v'?'view':mode==='t'?'stats':sub==='a'?'rasd':'set';
function go(m){const k=m==='v'?'view':m==='t'?'stats':sub==='a'?'rasd':'set';gate(k,()=>{mode=m;render()})}
function goSub(x){gate(x==='a'?'rasd':'set',()=>{sub=x;mode='m';render()})}
/* date */
function dateText(){const m=S.settings.dateMode;if(!m||m==='none')return '';const d=new Date(),o={day:'numeric',month:'long',year:'numeric'};
 const wd=d.toLocaleDateString('ar-SA',{weekday:'long'}),hj=d.toLocaleDateString('ar-SA-u-ca-islamic-umalqura-nu-latn',o),gr=d.toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',o);
 const p={d:[wd],dh:[wd,hj],dg:[wd,gr],dhg:[wd,hj+' | '+gr],h:[hj],g:[gr],hg:[hj+' | '+gr]}[m]||[];return p.length?'📅 '+p.join(' — '):''}
/* render */
function render(){
 setTheme(document.documentElement.dataset.theme);
 $('ico').textContent=T('icon');$('ttl').textContent=T('title');document.title=T('title');$('org').textContent=T('org');$('dt').textContent=dateText();

 $('modes').innerHTML=[['v','modeV','view'],['t','modeT','stats']].map(x=>`<button class="${mode===x[0]?'on':''}" onclick="go('${x[0]}')">${esc(T(x[1]))}${LKI(x[2])}</button>`).join('')+`<button class="${mode==='m'?'on':''}" onclick="go('m')">${esc(T('modeM'))}</button>`;
 const lk=lockOf();
 if(locked(lk)){$('app').innerHTML=`<div class="card empty">🔒 هذه الخانة مقفلة بالرمز<div class="row" style="justify-content:center;margin-top:10px"><button class="btn" onclick="gate('${lk}',render)">إدخال الرمز</button></div></div>`;return}

}
/* الرصد: التبويبات الداخلية */
const subNav=()=>`<div class="tabs" style="justify-content:center">`+[['a','modeA','rasd'],['s','modeS','set']].map(x=>`<button class="${sub===x[0]?'on':''}" onclick="goSub('${x[0]}')">${esc(T(x[1]))}${LKI(x[2])}</button>`).join('')+'</div>';

function viewV(){
 const gs=grpList();
 if(!gs.length)return '<div class="card empty">لا توجد مجموعات مفعّلة. فعّل مجموعة من '+esc(T('modeM'))+' ← '+esc(T('modeS'))+'.</div>';
 const ds=S.days.map((d,i)=>({...d,i})).filter(d=>d.on);

 if(!S.weeks.some(w=>w.id===vw))vw=S.cur;
 if(!gs.some(g=>g.id===vtab))vtab=gs[0].id;
 const g=gs.find(x=>x.id===vtab),st=vq?g.students.filter(s=>s.name.includes(vq)):g.students,wk=S.weeks.find(w=>w.id===vw);
 let h=S.groupsOn?'<div class="tabs">'+gs.map(x=>`<button class="${vtab===x.id?'on':''}" onclick="vtab='${x.id}';render()">${esc(x.name)} (${x.students.length})</button>`).join('')+'</div>':'';
 h+=`<div class="card"><div class="row">`+S.weeks.map(w=>`<button class="chip ${vw===w.id?'on':''}" onclick="vw='${w.id}';render()">${esc(w.name)}</button>`).join('')+`</div>`+
 `<div class="row" style="justify-content:space-between"><span class="wk">📅 ${esc(wk.name)}</span><span class="mut">${ST.map(x=>`<b style="color:${x[3]}">●</b> ${x[1]}`).join(' &nbsp; ')}</span></div>`+

 `<div class="wrap"><table class="grid"><tr><th rowspan="2">المشارك</th>${OH(2)}<th rowspan="2">اليوم والتاريخ</th><th colspan="2">حالة الحضور</th></tr><tr><th>الجلسة الأولى</th><th>الجلسة الثانية</th></tr>`+

  return `<tr class="${n?'':'pf'}">`+(n?'':`<td rowspan="${ds.length}">${esc(s.name)}</td>`+(F('wplace')?`<td rowspan="${ds.length}">${esc(s.org||'')}</td>`:''))+`<td class="dy">${esc(d.n)}${t?' <bdi>'+esc(t)+'</bdi>':''}</td>`+cell(0)+cell(1)+'</tr>'}).join('')).join(''):`<tr><td colspan="${3+(F('wplace')?1:0)+2}" class="empty">لا يوجد مشاركون</td></tr>`)+
 '</table></div><div class="mut" style="margin-top:6px">هذه الخانة للعرض فقط، ويتم التحضير من «'+esc(T('modeM'))+' ← '+esc(T('modeA'))+'».</div></div>';

/* التحضير */
const key=(w,d,k,s)=>`${w}|${d}|${k}|${s}`;
function rasdV(){

 if(!gs.length)return '<div class="card empty">لا توجد مجموعات مفعّلة. فعّل مجموعة من '+esc(T('modeS'))+'.</div>';

const MF=['groups','days','weeks','groupsOn','labels','feat','locks','settings','dates','seed1'];
let pendR=false;
function applyRemote(meta,att){
 if(meta)MF.forEach(f=>{if(meta[f]!==undefined&&meta[f]!==null)S[f]=meta[f]});
 if(att)S.att=att;
 S.labels=S.labels||{};S.feat=S.feat||{};S.locks=S.locks||{};S.att=S.att||{};S.settings=S.settings||{dateMode:'none'};S.dates=S.dates||{};S.groupsOn=!!S.groupsOn;
 if(!S.groups||!S.groups.length)S.groups=[{id:uid(),name:'المجموعة الأولى',on:true,students:[]}];
 if(!S.weeks||!S.weeks.length){const w=uid();S.weeks=[{id:w,name:'الأسبوع 1'}]}
 if(!S.weeks.find(w=>w.id===S.cur))S.cur=S.weeks[0].id;
 try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
 const a=document.activeElement;
 if(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){if(!pendR){pendR=true;a.addEventListener('blur',()=>{pendR=false;render()},{once:true})}}
 else render();
}
render();setInterval(()=>{$('dt').textContent=dateText()},60000);

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,getFirestore,doc,collection,onSnapshot,setDoc,getDocs,writeBatch,deleteField} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const st=t=>{const e=document.getElementById('cl');if(e)e.textContent=t};
const cfg=window.FIREBASE_CONFIG;
if(!cfg||!cfg.apiKey||cfg.apiKey.startsWith('PASTE')){st('💾 وضع محلي — لم يتم ربط Firebase بعد')}
else{
 const app=initializeApp(cfg);let db;
 try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})})}catch(e){db=getFirestore(app)}
 const room=doc(db,'rooms',window.ROOM),attCol=collection(db,'rooms',window.ROOM,'att');
 const MF=['groups','days','weeks','groupsOn','labels','feat','locks','settings','dates','seed1'];
 let ready=false,roomExists=false,lastMeta={},lastAtt={},pending=false;
 const ser=(S,f)=>JSON.stringify(S[f]===undefined?null:S[f]);
 const sp=k=>{const i=k.indexOf('|');return[k.slice(0,i),k.slice(i+1)]};
 const show=()=>st(!navigator.onLine?'📴 بدون اتصال — ستُزامَن التعديلات عند عودة الإنترنت':pending?'⏳ جارٍ المزامنة…':'☁️ متصل — التعديلات تظهر للجميع مباشرة');
 const fail=e=>{console.error(e);st('⚠️ تعذّر الحفظ في السحابة — راجع قواعد Firestore')};
 addEventListener('online',show);addEventListener('offline',show);
 st('☁️ جارٍ الاتصال…');
 window.cloudSync=()=>{
  if(!ready)return;const S=window.__S();
  const mu={};MF.forEach(f=>{const j=ser(S,f);if(lastMeta[f]!==j){mu[f]=j;lastMeta[f]=j}});
  if(Object.keys(mu).length)setDoc(room,mu,{merge:true}).catch(fail);
  const by={};const put=(k,v)=>{const[w,f]=sp(k);(by[w]=by[w]||{})[f]=v};
  for(const k in S.att)if(lastAtt[k]!==S.att[k])put(k,S.att[k]);
  for(const k in lastAtt)if(!(k in S.att))put(k,deleteField());
  lastAtt={...S.att};
  for(const w in by)setDoc(doc(attCol,w),by[w],{merge:true}).catch(fail);
 };
 window.cloudPushAll=async()=>{
  const S=window.__S();const mu={};MF.forEach(f=>{mu[f]=ser(S,f);lastMeta[f]=mu[f]});
  await setDoc(room,mu);roomExists=true;
  const by={};for(const k in S.att){const[w,f]=sp(k);(by[w]=by[w]||{})[f]=S.att[k]}
  const old=await getDocs(attCol);const b=writeBatch(db);
  old.forEach(d=>{if(!by[d.id])b.delete(d.ref)});
  for(const w in by)b.set(doc(attCol,w),by[w]);
  await b.commit();lastAtt={...S.att};
 };
 onSnapshot(room,{includeMetadataChanges:true},s=>{
  pending=s.metadata.hasPendingWrites;
  if(!s.exists()){
   if(!s.metadata.fromCache){roomExists=true;ready=true;window.cloudPushAll().then(show).catch(fail)}
   return;
  }
  roomExists=true;
  if(!s.metadata.hasPendingWrites){
   const d=s.data(),meta={};
   MF.forEach(f=>{if(typeof d[f]==='string'){lastMeta[f]=d[f];try{meta[f]=JSON.parse(d[f])}catch(e){}}});
   const first=!ready;ready=true;
   const before=MF.map(f=>ser(window.__S(),f)).join('|');
   const after=MF.map(f=>meta[f]!==undefined?JSON.stringify(meta[f]):ser(window.__S(),f)).join('|');
   if(first||before!==after)applyRemote(meta,null);
  }
  procAtt();
 },fail);
 let attSnap=null;
 const procAtt=()=>{
  const s=attSnap;if(!s||!roomExists||s.metadata.hasPendingWrites||(s.metadata.fromCache&&s.empty)){show();return}
  const att={};s.forEach(d=>{const o=d.data();for(const f in o)att[d.id+'|'+f]=o[f]});
  lastAtt={...att};
  if(JSON.stringify(att)!==JSON.stringify(window.__S().att))applyRemote(null,att);
  show();
 };
 onSnapshot(attCol,{includeMetadataChanges:true},s=>{pending=s.metadata.hasPendingWrites;attSnap=s;procAtt()},fail);
}
</script>
